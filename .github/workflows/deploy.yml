name: Despliegue SQL Server

on:
  push:
    branches: [ "main" ]

env:
  ACCEPT_EULA: Y
  MSSQL_PID: Developer
  SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Levantar SQL Server en Docker
        run: |
          docker run -e "ACCEPT_EULA=$ACCEPT_EULA" \
                     -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
                     -e "MSSQL_PID=$MSSQL_PID" \
                     -p 1433:1433 --name sqlserver -d mcr.microsoft.com/mssql/server:2022-latest

      - name: Esperar a que SQL Server esté listo
        run: |
          echo "Esperando a SQL Server..."
          for i in {1..30}; do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server está listo (intento $i)."
              exit 0
            fi
            echo "Intento $i... aún no responde."
            sleep 2
          done
          echo "SQL Server no respondió a tiempo."
          docker logs sqlserver
          exit 1

      - name: Instalar sqlcmd (Herramienta de línea de comandos)
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Ejecutar scripts SQL
        run: |
          sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -i sql/create_database.sql
          sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -i sql/create_tables.sql
          sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -i sql/create_procedure.sql
          sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -i sql/create_trigger.sql
          sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -i sql/test_data.sql

      - name: Verificar resultados en consola
        run: |
          echo "--- Datos en tabla Ventas ---"
          sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT * FROM EmpresaDB.dbo.Ventas;"
          echo "--- Datos en tabla AuditoriaVentas ---"
          sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT * FROM EmpresaDB.dbo.AuditoriaVentas;"